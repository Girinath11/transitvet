name: Forward check of open TESS signals
on:
  schedule:
    - cron: '17 3 * * 1'     # every Monday 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/forward_check.py
      - name: Commit if changed
        run: |
          git config user.name "transitvet-bot"
          git config user.email "transitvet-bot@users.noreply.github.com"
          git add docs/forward.json
          git diff --cached --quiet || (git commit -m "Forward check $(date -u +%F)" && git push)
