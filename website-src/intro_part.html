<style>
/* ---------- intro film ---------- */
#intro { position: fixed; inset: 0; z-index: 100; background: #02030a; overflow: hidden; transition: transform 1.2s cubic-bezier(.2,.7,.1,1), opacity 1.1s ease, filter 1.1s ease; }
#intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#intro .cap { position: absolute; left: 0; right: 0; bottom: 14vh; padding: 0 24px; text-align: center; pointer-events: none }
#intro .cap .l1 { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.035em; font-size: clamp(28px, 4.6vw, 60px); line-height: 1.1; color: #ece9e1; text-wrap: balance; max-width: 22ch; margin: 0 auto }
#intro .cap .l1 em { font-style: normal; font-weight: 400; background: linear-gradient(90deg, #b69cff, #5ee7ff 55%, #ff8bd1); -webkit-background-clip: text; background-clip: text; color: transparent }
#intro .cap .l2 { margin: 14px auto 0; max-width: 56ch; font-size: clamp(15px, 1.5vw, 19px); color: #c9c6bd; line-height: 1.55 }
#intro .w { display: inline-block; opacity: 0; transform: translateY(14px); filter: blur(6px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.1,1), filter .7s ease }
#intro .w.in { opacity: 1; transform: none; filter: none }
#intro .cap.out .w { opacity: 0; transform: translateY(-10px); filter: blur(6px); transition-duration: .45s }
#intro .top { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); z-index: 2 }
#intro .brand { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.03em; font-size: 20px; color: #ece9e1 }
#intro .brand i { font-style: normal; color: #a78bfa }
#intro .skip { font: 600 14px var(--f-body); color: #ece9e1; background: rgba(10, 14, 25, 0.6); border: 1px solid rgba(214, 222, 240, 0.28); border-radius: 999px; padding: 9px 18px; cursor: pointer; backdrop-filter: blur(6px); transition: border-color .3s, background .3s }
#intro .skip:disabled { color: #8f93a0; cursor: default }
#intro .skip:not(:disabled):hover { border-color: #a78bfa; background: rgba(167, 139, 250, 0.15) }
#intro .bar { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: linear-gradient(90deg, #a78bfa, #5ee7ff); z-index: 3 }
#intro .enter { position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .8s ease; }
#intro .enter.show { opacity: 1; pointer-events: auto }
#intro.leave { transform: scale(1.12); opacity: 0; filter: blur(16px); pointer-events: none }
html.pre body { overflow: hidden }
html.pre header.nav, html.pre main, html.pre footer { transform: scale(.94); opacity: 0; filter: blur(10px) }
html.reveal header.nav, html.reveal main, html.reveal footer { transition: transform 1.3s cubic-bezier(.2,.7,.1,1), opacity 1.1s ease, filter 1.1s ease; transform-origin: 50% 30vh }
#replay { font: inherit; font-size: 15px; color: var(--soft); background: none; border: 0; cursor: pointer; padding: 0 }
#replay:hover { color: var(--star) }
@media (prefers-reduced-motion: reduce) { #intro, #intro .w, html.reveal header.nav, html.reveal main, html.reveal footer { transition: none !important } }
</style>
<div id="intro" role="dialog" aria-label="Introduction film" hidden>
  <div class="bar" id="iBar"></div>
  <canvas id="iCv" aria-hidden="true"></canvas>
  <div class="top"><span class="brand">Transit<i>Vet</i></span><button type="button" class="skip" id="iSkip" disabled>Skip in 5</button></div>
  <div class="cap" id="iCap" aria-live="polite"></div>
  <button type="button" class="btn primary enter" id="iEnter">Enter TransitVet</button>
</div>
<script>
(function intro() {
  const el = document.getElementById('intro'), cv = document.getElementById('iCv'), cap = document.getElementById('iCap'),
        skip = document.getElementById('iSkip'), bar = document.getElementById('iBar'), enter = document.getElementById('iEnter');
  const RMo = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let seen = false; try { seen = sessionStorage.getItem('tv-intro') === '1' } catch (e) {}
  const SC = [
    { d: 6.5, a: 'Every star you see <em>is a sun.</em>', b: 'And most of them are much farther away than they look.' },
    { d: 6.5, a: 'Many have planets <em>of their own.</em>', b: 'Planets around other stars are called exoplanets.' },
    { d: 6.5, a: "But we almost <em>never see them.</em>", b: 'A star is so bright that its planets are lost in the glare.' },
    { d: 8.0, a: 'So we watch the star <em>dim instead.</em>', b: 'When a planet passes in front, the starlight drops a tiny amount. This is called a transit.' },
    { d: 7.5, a: 'Brightness over time is <em>a light curve.</em>', b: "NASA's Kepler (2009–2018) and TESS (since 2018) recorded light curves for a huge number of stars." },
    { d: 7.5, a: "Most dips <em>aren't planets.</em>", b: 'Two stars eclipsing each other, a brighter neighbour, or a glitch in the camera can all make a dip.' },
    { d: 8.0, a: 'TransitVet <em>questions every dip.</em>', b: 'It finds dips that repeat, runs them through checks and three models, and says which could be planet candidates.' },
    { d: 7.0, a: 'Explore real signals. <em>Try any star.</em>', b: 'Everything it finds is a candidate until astronomers confirm it.' }];
  const TOTAL = SC.reduce((s, x) => s + x.d, 0);
  let x, W, H, D, stars = [], t0 = 0, raf = 0, cur = -1, done = false;
  function size() { D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; x = cv.getContext('2d'); x.setTransform(D, 0, 0, D, 0, 0);
    let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    stars = Array.from({ length: Math.round(W * H / 1500) }, () => ({ x: r() * 2 - 1, y: r() * 2 - 1, z: r(), c: r() < .2 ? '#cbbcff' : r() < .3 ? '#9fe9ff' : '#eef2ff' })) }
  const ease = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2, cl = v => Math.max(0, Math.min(1, v));
  function sky(speed, a = 1) { const cx = W / 2, cy = H / 2;
    for (const s of stars) { const z = ((s.z - speed) % 1 + 1) % 1, k = 1 / (0.15 + z), px = cx + s.x * k * W * 0.18, py = cy + s.y * k * H * 0.18;
      if (px < 0 || px > W || py < 0 || py > H) continue; x.globalAlpha = a * Math.min(1, (1 - z) * 1.4); x.fillStyle = s.c; x.fillRect(px, py, (1 - z) * 2 + .3, (1 - z) * 2 + .3) }
    x.globalAlpha = 1 }
  function sun(cx, cy, R, glow = 1, hue = 'blue') { const g = x.createRadialGradient(cx, cy, R * .8, cx, cy, R * 3.2); g.addColorStop(0, `rgba(160,180,255,${.45 * glow})`); g.addColorStop(.4, `rgba(140,110,255,${.12 * glow})`); g.addColorStop(1, 'rgba(120,110,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R * 3.2, 0, 6.283); x.fill();
    const d = x.createRadialGradient(cx - R * .2, cy - R * .2, R * .05, cx, cy, R); d.addColorStop(0, '#ffffff'); d.addColorStop(.55, '#d6e4ff'); d.addColorStop(.9, '#8fb0ff'); d.addColorStop(1, '#5b6be0');
    x.fillStyle = d; x.beginPath(); x.arc(cx, cy, R, 0, 6.283); x.fill() }
  function planet(px, py, r, lit = 1) { const g = x.createRadialGradient(px - r * .4, py - r * .4, r * .1, px, py, r); g.addColorStop(0, `rgba(170,150,255,${lit})`); g.addColorStop(.6, '#2b2560'); g.addColorStop(1, '#07061a');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill() }
  function curve(x0, x1, yb, depth, fn, n, col = '#5ee7ff', upto = 1, label) { x.strokeStyle = 'rgba(214,222,240,.18)'; x.lineWidth = 1; x.beginPath(); x.moveTo(x0, yb); x.lineTo(x1, yb); x.stroke();
    x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); const m = Math.max(2, Math.floor(n * upto));
    for (let i = 0; i < m; i++) { const u = i / (n - 1), px = x0 + u * (x1 - x0), py = yb + fn(u) * depth + Math.sin(i * 12.9898) * 1.2; i ? x.lineTo(px, py) : x.moveTo(px, py) } x.stroke();
    if (label) { x.fillStyle = '#8f93a0'; x.font = `12px ${getComputedStyle(document.body).getPropertyValue('--f-mono') || 'monospace'}`; x.fillText(label, x0, yb - depth * 0.2 - 12) } }
  const box = (u, c, w) => Math.abs(u - c) < w ? 1 : (Math.abs(u - c) < w * 1.4 ? (w * 1.4 - Math.abs(u - c)) / (w * .4) : 0);
  const SCN = [
    (k, T) => { sky(T * 0.025); },
    (k, T) => { sky(0.16 + T * 0.004, .8); const R = Math.min(W, H) * .09, cx = W / 2, cy = H * .42, a = T * 0.9, rx = R * 3.6, ry = R * .9;
      x.strokeStyle = 'rgba(167,139,250,.25)'; x.lineWidth = 1; x.beginPath(); x.ellipse(cx, cy, rx, ry, -.12, 0, 6.283); x.stroke();
      const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry - Math.cos(a) * rx * .12, front = Math.sin(a) > 0;
      if (!front) planet(px, py, R * .22, .8); sun(cx, cy, R, ease(cl(k * 3))); if (front) planet(px, py, R * .22, 1) },
    (k, T) => { sky(0.2, .6); const R = Math.min(W, H) * .07, cx = W / 2, cy = H * .42; const g = 1 + 2.5 * ease(cl(k * 1.5));
      sun(cx, cy, R, g); x.fillStyle = `rgba(255,255,255,${.25 * cl(k * 2)})`; x.fillRect(0, 0, W, H);
      const px = cx + R * 2.6, py = cy - R * .4; x.globalAlpha = 1 - .85 * cl(k * 1.6); planet(px, py, R * .12); x.globalAlpha = 1;
      x.strokeStyle = `rgba(94,231,255,${.6 * cl(k * 2 - .3)})`; x.lineWidth = 1.2; x.beginPath(); x.arc(px, py, R * .5, 0, 6.283); x.stroke() },
    (k, T) => { sky(0.2, .5); const R = Math.min(W, H) * .13, cx = W / 2, cy = H * .3; sun(cx, cy, R);
      const u = cl((k - .08) / .8), pos = -1.5 + 3 * u, pr = .28, px = cx + pos * R, py = cy + R * .2; planet(px, py, R * pr, .5);
      const f = v => { const dx = Math.abs(v); return dx >= 1 + pr ? 0 : dx <= 1 - pr ? 1 : (1 + pr - dx) / (2 * pr) };
      curve(W * .22, W * .78, H * .58, H * .07, v => f(-1.5 + 3 * v), 220, '#5ee7ff', u, 'brightness') },
    (k, T) => { sky(0.2, .4); const fn = v => { const p = (v * 7.3 + .35) % 1; return box(p, .5, .025) * 1 };
      curve(W * .08, W * .92, H * .45, H * .08, fn, 900, '#5ee7ff', ease(cl(k * 1.3)), 'brightness · years of data') },
    (k, T) => { sky(0.2, .4); const y0 = H * .22, gap = H * .14;
      const rows = [[v => box((v * 4 + .2) % 1, .5, .04) * ((Math.floor(v * 4 + .2) % 2) ? .45 : 1), 'two stars: deep, shallow, deep...'],
                    [v => Math.max(0, 1 - Math.abs(((v * 3 + .1) % 1) - .5) * 9), 'V-shaped: stars grazing each other'],
                    [v => (Math.abs(v - .63) < .006 ? -1.6 : 0) + (Math.abs(v - .31) < .02 ? .5 : 0), 'a one-off glitch']];
      rows.forEach((r, i) => { const a = cl(k * 3 - i * .5); x.globalAlpha = a; curve(W * .2, W * .8, y0 + i * gap, H * .045, r[0], 500, '#a78bfa', 1, r[1]); x.globalAlpha = 1 }) },
    (k, T) => { sky(0.2, .4); const n = 7, names = ['Download', 'Clean', 'Flatten', 'Search', 'Fold', 'Check', 'Verdict'], y = H * .36, x0 = W * .12, x1 = W * .88;
      const prog = cl(k * 1.25) * n; x.strokeStyle = 'rgba(214,222,240,.15)'; x.lineWidth = 2; x.beginPath(); x.moveTo(x0, y); x.lineTo(x1, y); x.stroke();
      const g = x.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#a78bfa'); g.addColorStop(1, '#5ee7ff'); x.strokeStyle = g; x.beginPath(); x.moveTo(x0, y); x.lineTo(x0 + (x1 - x0) * Math.min(1, prog / (n - 1)), y); x.stroke();
      const fs = Math.max(11, Math.min(15, W / 70));
      for (let i = 0; i < n; i++) { const px = x0 + (x1 - x0) * i / (n - 1), on = prog >= i, r = Math.min(22, W / 40);
        if (on) { x.shadowColor = '#a78bfa'; x.shadowBlur = 18 } x.fillStyle = on ? g : '#0a0e19'; x.beginPath(); x.arc(px, y, r, 0, 6.283); x.fill(); x.shadowBlur = 0;
        x.strokeStyle = on ? 'transparent' : 'rgba(214,222,240,.3)'; x.lineWidth = 1; x.stroke();
        x.fillStyle = on ? '#0a0820' : '#8f93a0'; x.font = `600 ${fs}px Sora, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(on ? '✓' : i + 1, px, y + 1);
        x.fillStyle = on ? '#ece9e1' : '#8f93a0'; x.font = `600 ${fs}px Manrope, sans-serif`; x.fillText(names[i], px, y + r + 18) }
      x.textAlign = 'left'; x.textBaseline = 'alphabetic' },
    (k, T) => { sky(0.2 + T * .05, .9); const R = Math.min(W, H) * (.07 + .05 * ease(cl(k))), cx = W / 2, cy = H * .38; sun(cx, cy, R, 1.2); planet(cx + R * .35, cy + R * .1, R * .25, .4) }];
  function words(html) { const tmp = document.createElement('div'); tmp.innerHTML = html; let i = 0, out = '';
    tmp.childNodes.forEach(n => { const txt = n.textContent.split(/(\s+)/); const wrap = s => s.trim() ? `<span class="w" style="transition-delay:${(i++) * 70}ms">${s}</span>` : s;
      out += n.nodeType === 3 ? txt.map(wrap).join('') : `<em>${txt.map(wrap).join('')}</em>` }); return out }
  function caption(i) { const s = SC[i]; cap.classList.add('out');
    setTimeout(() => { cap.classList.remove('out'); cap.innerHTML = `<div class="l1">${words(s.a)}</div><div class="l2">${words(s.b)}</div>`;
      requestAnimationFrame(() => requestAnimationFrame(() => cap.querySelectorAll('.w').forEach(w => w.classList.add('in')))) }, cur < 0 ? 0 : 420) }
  function frame(now) { if (done) return; if (!t0) t0 = now; const T = (now - t0) / 1000;
    let acc = 0, i = 0; while (i < SC.length - 1 && T > acc + SC[i].d) { acc += SC[i].d; i++ }
    if (i !== cur) { caption(i); cur = i }
    const k = cl((T - acc) / SC[i].d); x.clearRect(0, 0, W, H); SCN[i](k, T);
    const fadeIn = cl((T - acc) / .6), fadeOut = i < SC.length - 1 ? cl((acc + SC[i].d - T) / .5) : 1; x.fillStyle = `rgba(2,3,10,${1 - Math.min(fadeIn, fadeOut)})`; x.fillRect(0, 0, W, H);
    bar.style.width = (100 * Math.min(1, T / TOTAL)) + '%';
    const left = Math.ceil(5 - T); if (left > 0) { skip.textContent = `Skip in ${left}`; skip.disabled = true } else if (skip.disabled) { skip.disabled = false; skip.textContent = 'Skip intro →' }
    if (i === SC.length - 1 && k > .25) enter.classList.add('show');
    if (T >= TOTAL + 1.2) return leave();
    raf = requestAnimationFrame(frame) }
  function leave() { if (done) return; done = true; cancelAnimationFrame(raf); try { sessionStorage.setItem('tv-intro', '1') } catch (e) {}
    const h = document.documentElement; h.classList.add('reveal'); el.classList.add('leave');
    requestAnimationFrame(() => h.classList.remove('pre'));
    setTimeout(() => { el.hidden = true; h.classList.remove('reveal'); removeEventListener('resize', size) }, 1400) }
  function start() { done = false; cur = -1; t0 = 0; el.hidden = false; el.classList.remove('leave'); enter.classList.remove('show'); cap.innerHTML = '';
    document.documentElement.classList.add('pre'); size(); addEventListener('resize', size);
    if (RMo) { cap.innerHTML = `<div class="l1">${SC[6].a}</div><div class="l2">${SC[6].b}</div>`; enter.classList.add('show'); skip.disabled = false; skip.textContent = 'Skip intro →'; x.clearRect(0, 0, W, H); sky(0.2); return }
    raf = requestAnimationFrame(frame); skip.focus({ preventScroll: true }) }
  skip.addEventListener('click', leave); enter.addEventListener('click', leave);
  addEventListener('keydown', e => { if (!el.hidden && !skip.disabled && (e.key === 'Escape')) leave() });
  window.tvReplayIntro = () => { scrollTo(0, 0); start() };
  if (!seen) start();
})();
</script>
